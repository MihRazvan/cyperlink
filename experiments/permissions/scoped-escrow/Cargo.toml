[package]
name = "cyperlink-scoped-escrow-probe"
version = "0.1.0"
edition = "2021"
[workspace]
[lib]
crate-type = ["cdylib", "lib"]
[dependencies]
solana-account-info = "=3.1.1"
solana-address = { version = "=2.8.0", features = ["curve25519", "sha2"] }
solana-program-entrypoint = "=3.1.1"
solana-program-error = "=3.0.1"
solana-instruction = "=3.3.0"
solana-cpi = "=3.1.0"
solana-sha256-hasher = "=3.1.0"
solana-clock = "=3.2.1"
solana-sysvar = "=3.1.1"
spl-token-2022-interface = "=3.1.0"
cyperlink-pda-provisioning = { path = "../../../crates/pda-provisioning" }
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
