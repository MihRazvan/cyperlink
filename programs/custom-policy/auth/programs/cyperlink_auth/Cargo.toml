[package]
name = "cyperlink_auth"
version = "0.1.0"
description = "Created with Arcium & Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "cyperlink_auth"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "arcium-anchor/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
arcium-client = { default-features = false, version = "=0.15.0" }
arcium-macros = "=0.15.0"
arcium-anchor = "=0.15.0"

solana-sha256-hasher="=3.1.0"

solana-zk-elgamal-proof-interface="=0.1.3"
solana-curve25519="=3.1.14"
bytemuck="=1.25.2"

cyperlink-native-admission = { path = "../../../../../crates/native-admission" }

cyperlink-hook-routing = { path = "../../../../../crates/hook-routing" }

cyperlink-custom-policy-layout = { path = "../../../../../crates/custom-policy-layout" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
