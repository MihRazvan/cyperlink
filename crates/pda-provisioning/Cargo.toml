[package]
name = "cyperlink-pda-provisioning"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
solana-account-info = "=3.1.1"
solana-address = { version = "=2.8.0", features = ["curve25519", "sha2"] }
solana-cpi = "=3.1.0"
solana-program-error = "=3.0.1"
solana-rent = "=3.1.0"
solana-sysvar = "=3.1.1"
solana-system-interface = { version = "=2.0.0", features = ["bincode"] }

