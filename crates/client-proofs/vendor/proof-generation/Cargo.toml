[package]
name = "spl-token-confidential-transfer-proof-generation"
version = "0.6.1"
edition = "2021"
license = "Apache-2.0"
description = "Recorded CyperLink research upstream transfer proof generator, with opening export"

[dependencies]
curve25519-dalek = "=4.1.3"
solana-zk-sdk = "=7.0.1"
